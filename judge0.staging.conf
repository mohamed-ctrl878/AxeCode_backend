# Judge0 Configuration — STAGING ONLY
# Distinct credentials from judge0.conf (production) purely so a
# misconfigured connection string can never accidentally reach the
# production Judge0 database.

# Database
POSTGRES_DB=judge0_staging
POSTGRES_USER=judge0_staging
POSTGRES_PASSWORD=judge0_staging_pass_only

# Redis
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_staging_redis_pass

# Postgres
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432

# Judge0 Settings
JUDGE0_HTTP_PORT=2358
JUDGE0_WORKER_CONCURRENCY=2
JUDGE0_POST_EXECUTION_CLEANUP=true
