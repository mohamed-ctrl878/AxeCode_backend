databases:
  - name: axecode-db-staging
    databaseName: strapi
    user: strapi
    plan: free # Change to starter/standard for production

services:
  - type: web
    name: axecode-backend-staging
    env: node
    plan: free # Change to starter/standard for production
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      # Core Strapi Environment
      - key: NODE_ENV
        value: staging
      
      # Database Connection (Auto-linked to the PostgreSQL instance above)
      - key: DATABASE_URL
        fromDatabase:
          name: axecode-db-staging
          property: connectionString
      - key: DATABASE_SSL
        value: "false" # Render internal DB connections don't use SSL

      # Auto-generated secrets
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # Important 3rd party secrets (User needs to fill these in the Render Dashboard)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
        
      - key: KASHIER_MERCHANT_ID
        sync: false
      - key: KASHIER_API_KEY
        sync: false
      - key: KASHIER_WEBHOOK_SECRET
        sync: false
      - key: KASHIER_MODE
        value: test

      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_REQUIRED
        value: "true"
      
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@axecode.com
        
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      
      # Allow frontend connections (Update this with your frontend URL later)
      - key: CORS_ORIGIN
        sync: false
